name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  logger: ^2.3.0
  flutter_dotenv: ^5.1.0
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  get_it: ^7.7.0
  riverpod_annotation: ^2.3.5
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.8
  supabase: ^2.6.0
  webview_flutter: ^4.10.0
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  permission_handler: ^12.0.3
  mapbox_maps_flutter: any
  intl: ^0.20.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_localizations:
    sdk: flutter

  # Push Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.10
  riverpod_generator: ^2.4.0
  intl_utils: ^2.8.7
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/logo.png
    - assets/data/mechanical_catalog.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon_square.png"
  adaptive_icon_background: "#141414"
  adaptive_icon_foreground: "assets/icons/icon.png"
  remove_alpha_ios: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700