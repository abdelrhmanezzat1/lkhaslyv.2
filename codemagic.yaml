# Codemagic CI for Lakhsly iOS.
#
# CURRENT STATE: unsigned verification build only (no Apple Developer
# Program subscription yet). When you subscribe later, restore:
#   1. groups: signing (+ app_store_connect once ASC keys exist)
#   2. the certificate-import + signed-export scripts (see git history,
#      commit 7318a71 for the previous full version)
#   3. the app_store_connect publishing block
workflows:
  ios-release:
    name: Build Lakhsly iOS (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.4
      xcode: latest
      groups:
        - app_secrets
    scripts:
      - name: Setup Mapbox token
        script: |
          if [ -n "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "machine api.mapbox.com login macos password $MAPBOX_DOWNLOADS_TOKEN" > ~/.netrc
            chmod 0600 ~/.netrc
          fi

      - name: Install dependencies
        script: |
          flutter pub get
          cd ios && pod install && cd ..

      - name: Create .env from secrets
        script: |
          : > .env
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "MAPBOX_ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN"
            echo "FIREBASE_API_KEY=$FIREBASE_API_KEY"
            echo "FIREBASE_APP_ID=$FIREBASE_APP_ID"
            echo "FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            echo "FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN"
            echo "FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET"
            echo "FIREBASE_MEASUREMENT_ID=$FIREBASE_MEASUREMENT_ID"
            echo "FIREBASE_IOS_BUNDLE_ID=$FIREBASE_IOS_BUNDLE_ID"
            echo "FIREBASE_IOS_API_KEY=$FIREBASE_IOS_API_KEY"
            echo "FIREBASE_IOS_APP_ID=$FIREBASE_IOS_APP_ID"
            echo "FIREBASE_IOS_CLIENT_ID=$FIREBASE_IOS_CLIENT_ID"
          } >> .env
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "ERROR: Missing required secrets."
            exit 1
          fi

      # Unsigned verification build — proves the code compiles and links
      # against all native pods without needing any Apple credentials.
      - name: Build iOS App (unsigned)
        script: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          cd build/ios
          mkdir -p ipa Payload
          cp -r iphoneos/Runner.app Payload/
          zip -qr ipa/lakhsly-unsigned.ipa Payload

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - abdelrahmansoliman101@gmail.com
