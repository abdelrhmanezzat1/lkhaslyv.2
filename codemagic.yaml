# Codemagic CI for Lakhsly iOS - signed Ad Hoc build for OTA distribution.
#
# Requires Codemagic secrets:
#   group `signing`:
#     SIGNING_CERTIFICATE_P12          - base64 of export_anar.p12 (password 1234)
#     SIGNING_CERTIFICATE_P12_PASSWORD - 1234
#   group `app_secrets`:
#     SUPABASE_URL, SUPABASE_ANON_KEY, MAPBOX_ACCESS_TOKEN,
#     MAPBOX_DOWNLOADS_TOKEN, FIREBASE_* (see "Create .env from secrets")
#
# If the signing secrets are absent the workflow falls back to an unsigned
# --no-codesign verification build, so the pipeline never hard-fails on CI.
#
# No App Store Connect publishing: the signed .ipa is only published as a
# build artifact for OTA distribution.
workflows:
  ios-release:
    name: Build Lakhsly iOS (signed Ad Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.4
      xcode: latest
      groups:
        - app_secrets
        - signing
    scripts:
      - name: Setup Mapbox token
        script: |
          if [ -n "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "machine api.mapbox.com login macos password $MAPBOX_DOWNLOADS_TOKEN" > ~/.netrc
            chmod 0600 ~/.netrc
          fi

      - name: Install dependencies
        script: |
          flutter pub get
          cd ios && pod install && cd ..

      - name: Create .env from secrets
        script: |
          : > .env
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "MAPBOX_ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN"
            echo "FIREBASE_API_KEY=$FIREBASE_API_KEY"
            echo "FIREBASE_APP_ID=$FIREBASE_APP_ID"
            echo "FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            echo "FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN"
            echo "FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET"
            echo "FIREBASE_MEASUREMENT_ID=$FIREBASE_MEASUREMENT_ID"
            echo "FIREBASE_IOS_BUNDLE_ID=$FIREBASE_IOS_BUNDLE_ID"
            echo "FIREBASE_IOS_API_KEY=$FIREBASE_IOS_API_KEY"
            echo "FIREBASE_IOS_APP_ID=$FIREBASE_IOS_APP_ID"
            echo "FIREBASE_IOS_CLIENT_ID=$FIREBASE_IOS_CLIENT_ID"
          } >> .env
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "ERROR: Missing required secrets."
            exit 1
          fi

      - name: Import signing certificate
        script: |
          if [ -z "$SIGNING_CERTIFICATE_P12" ]; then
            echo "SIGNING_CERTIFICATE_P12 not set - unsigned verification build."
            echo "SIGNED=false" >> $CM_ENV
            exit 0
          fi
          set -euo pipefail
          test -f ota/profile.mobileprovision || {
            echo "ERROR: ota/profile.mobileprovision not found in the repository."
            exit 1
          }

          KEYCHAIN="$CM_BUILD_DIR/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$CM_BUILD_DIR/sign.p12"
          security import "$CM_BUILD_DIR/sign.p12" \
            -k "$KEYCHAIN" \
            -P "$SIGNING_CERTIFICATE_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i ota/profile.mobileprovision)")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp ota/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "SIGNED=true" >> $CM_ENV
          echo "Signing identity imported (profile $PROFILE_UUID)"

      - name: Build signed IPA
        script: |
          set -euo pipefail
          if [ "${SIGNED:-false}" != "true" ]; then
            echo "Signing unavailable - falling back to unsigned build."
            flutter build ios --release --no-codesign
            cd build/ios
            mkdir -p ipa Payload
            cp -r iphoneos/Runner.app Payload/
            zip -qr ipa/lakhsly-unsigned.ipa Payload
            rm -rf Payload
            exit 0
          fi

          cat > "$CM_BUILD_DIR/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>method</key>
          	<string>ad-hoc</string>
          	<key>teamID</key>
          	<string>4Z7V3V3G9R</string>
          	<key>uploadSymbols</key>
          	<true/>
          	<key>compileBitcode</key>
          	<false/>
          	<key>provisioningProfiles</key>
          	<dict>
          		<key>com.anaranar.lkhsly</key>
          		<string>${PROFILE_UUID}</string>
          	</dict>
          </dict>
          </plist>
          EOF
          flutter build ipa --release --export-options-plist="$CM_BUILD_DIR/ExportOptions.plist"

          # Canonical artifact name for the OTA download link.
          if ls build/ios/ipa/*.ipa >/dev/null 2>&1; then
            cp "$(ls build/ios/ipa/*.ipa | head -n 1)" build/ios/ipa/lakhsly.ipa
          fi

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - abdelrahmansoliman101@gmail.com
