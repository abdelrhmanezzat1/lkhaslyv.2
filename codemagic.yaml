workflows:
  ios-release:
    name: Build iOS (IPA) for Lakhsly
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      vars:
        API_BASE_URL: "https://dummy.ngrok-free.app"
    scripts:
      - name: إعداد توكن Mapbox
        script: |
          if [ -n "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "machine api.mapbox.com login macos password $MAPBOX_DOWNLOADS_TOKEN" > ~/.netrc
            chmod 0600 ~/.netrc
          fi
      - name: تنظيف المشروع
        script: flutter clean
      - name: تحميل الحزم و CocoaPods
        script: |
          flutter pub get
          cd ios && pod install && cd ..
      - name: إنشاء البيئة وبناء IPA
        script: |
          # 1. إنشاء ملف .env في المسار الرئيسي تلقائياً
          touch .env
          echo "API_BASE_URL=$API_BASE_URL" > .env

          # 2. إعدادات تخطي التوقيع الرقمي في Xcode
          echo "DEVELOPMENT_TEAM=1234567890" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig

          # 3. بناء التطبيق
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --obfuscate \
            --split-debug-info=build/debug-info

          # 4. تجميع الـ IPA
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r app-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa
    publishing:
      email:
        recipients:
          - abdelrahmansoliman101@gmail.com