workflows:
  ios-adhoc:
    name: iOS Ad Hoc Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.4
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.anaranar.lkhsly
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      groups:
        - lkhsly_secrets   # هتجمع فيه كل الـ env vars فوق من الواجهة

    scripts:
      - name: Create .env file
        script: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          MAPBOX_ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN
          FIREBASE_API_KEY=$FIREBASE_API_KEY
          FIREBASE_APP_ID=$FIREBASE_APP_ID
          FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID
          FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID
          FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN
          FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET
          FIREBASE_MEASUREMENT_ID=$FIREBASE_MEASUREMENT_ID
          FIREBASE_IOS_BUNDLE_ID=$FIREBASE_IOS_BUNDLE_ID
          FIREBASE_IOS_API_KEY=$FIREBASE_IOS_API_KEY
          FIREBASE_IOS_APP_ID=$FIREBASE_IOS_APP_ID
          FIREBASE_IOS_CLIENT_ID=$FIREBASE_IOS_CLIENT_ID
          EOF

      - name: Set up Mapbox token for CocoaPods
        script: |
          echo "machine api.mapbox.com login mapbox password $MAPBOX_DOWNLOADS_TOKEN" > ~/.netrc
          chmod 0600 ~/.netrc

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Build ipa for distribution
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - freon.fr3on@gmail.com
