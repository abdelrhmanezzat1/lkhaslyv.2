name: Build Flutter iOS

on:
  push:
    branches: [ main ] # أو اسم الفرع الأساسي لديك مثل master

jobs:
  build:
    runs-on: macos-latest # هذا سيشغل جهاز ماك افتراضي في سحاب جيت هاب

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # أو إصدار فلاتر المحدد لديك
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (IPA)
        # ملاحظة: بدون حساب مطور أبل، البناء سيتطلب إعدادات توقيع (Signing).
        # إذا لم يكن لديك حساب، يمكنك بناء التطبيق للتأكد من عدم وجود أخطاء برمجية عبر:
        run: flutter build ios --no-codesign