name: Build iOS IPA (Signed + OTA)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  register-devices:
    name: Register devices + regenerate profile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Register new devices with Apple and regenerate Ad Hoc profile
        shell: bash
        env:
          ASC_P8: ${{ secrets.ASC_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "$ASC_P8" ]; then
            bash tool/asc_register.sh
          else
            echo "ASC_P8 not configured - skipping Apple device registration."
          fi

      - name: Commit profile + devices and trigger build
        shell: bash
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "ota-bot"
          git config user.email "ota-bot@users.noreply.github.com"
          if git diff --quiet -- ota/devices.json ota/profile.mobileprovision; then
            echo "No changes to commit - skipping build trigger."
            exit 0
          fi
          git add ota/devices.json ota/profile.mobileprovision
          git commit -m "ota: regenerate Ad Hoc profile for registered devices"
          git push
          if [ -n "$GH_DISPATCH_TOKEN" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d '{"ref":"main"}' \
              https://api.github.com/repos/abdelrhmanezzat1/lkhaslyv.2/actions/workflows/build-ios.yml/dispatches \
              && echo "Build dispatched." || echo "WARNING: could not dispatch build - run it manually or push again."
          else
            echo "WARNING: GH_DISPATCH_TOKEN not set - build will only run on next push/manual run."
          fi

  build:
    name: Build iOS IPA
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.package.outputs.signed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Set up Mapbox download token
        shell: bash
        run: |
          if [ -n "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "machine api.mapbox.com login mapbox password $MAPBOX_DOWNLOADS_TOKEN" > ~/.netrc
            chmod 0600 ~/.netrc
          else
            echo "::error::MAPBOX_DOWNLOADS_TOKEN secret is missing. Add it to GitHub > Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}

      - name: Create .env file
        shell: bash
        run: |
          : > .env
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "MAPBOX_ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN"
            echo "FIREBASE_API_KEY=$FIREBASE_API_KEY"
            echo "FIREBASE_APP_ID=$FIREBASE_APP_ID"
            echo "FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            echo "FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN"
            echo "FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET"
            echo "FIREBASE_MEASUREMENT_ID=$FIREBASE_MEASUREMENT_ID"
            echo "FIREBASE_IOS_BUNDLE_ID=$FIREBASE_IOS_BUNDLE_ID"
            echo "FIREBASE_IOS_API_KEY=$FIREBASE_IOS_API_KEY"
            echo "FIREBASE_IOS_APP_ID=$FIREBASE_IOS_APP_ID"
            echo "FIREBASE_IOS_CLIENT_ID=$FIREBASE_IOS_CLIENT_ID"
          } >> .env
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_ANON_KEY or MAPBOX_ACCESS_TOKEN secret is empty. Add them to GitHub > Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_IOS_BUNDLE_ID: ${{ secrets.FIREBASE_IOS_BUNDLE_ID }}
          FIREBASE_IOS_API_KEY: ${{ secrets.FIREBASE_IOS_API_KEY }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_IOS_CLIENT_ID: ${{ secrets.FIREBASE_IOS_CLIENT_ID }}

      - name: Install dependencies
        run: flutter pub get

      - name: Run pod install
        run: |
          cd ios
          pod install
          cd ..

      # ---- Signing: only when SIGNING_CERTIFICATE_P12 secret is set ----
      - name: Configure signing identity
        id: signing
        shell: bash
        env:
          P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "SIGNING_CERTIFICATE_P12 not set - build will be unsigned."
            exit 0
          fi
          set -euo pipefail
          test -f ota/profile.mobileprovision || { echo "::error::ota/profile.mobileprovision not found - run register-devices or seed the repo."; exit 1; }
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i ota/profile.mobileprovision)")
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp ota/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain"
          security create-keychain -p temp "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p temp "$KEYCHAIN"
          security import "$RUNNER_TEMP/sign.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp "$KEYCHAIN" > /dev/null || true
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Signing identity imported (profile $PROFILE_UUID)"

      - name: Build iOS App (Signed)
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>method</key>
          	<string>ad-hoc</string>
          	<key>teamID</key>
          	<string>4Z7V3V3G9R</string>
          	<key>provisioningProfiles</key>
          	<dict>
          		<key>com.anaranar.lkhsly</key>
          		<string>${PROFILE_UUID}</string>
          	</dict>
          </dict>
          </plist>
          EOF
          flutter build ipa --release --codesign --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Build iOS App (Unsigned - fallback)
        if: steps.signing.outputs.signed != 'true'
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        id: package
        shell: bash
        run: |
          cd build/ios
          find ipa -maxdepth 1 -name '*.ipa' -print | head -n 1 | while read -r f; do cp "$f" ipa/lakhsly.ipa; done
          if [ -f "ipa/lakhsly.ipa" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            mkdir -p ipa Payload
            cp -r iphoneos/Runner.app Payload/
            zip -r ipa/lakhsly-unsigned.ipa Payload
            rm -rf Payload
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Signed IPA Artifact
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lakhsly-ios-signed
          path: build/ios/ipa/lakhsly.ipa
          retention-days: 7

      - name: Upload Unsigned IPA Artifact
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lakhsly-ios-unsigned
          path: build/ios/ipa/lakhsly-unsigned.ipa
          retention-days: 7

  publish-ota:
    name: Publish OTA Install Link
    needs: build
    if: ${{ needs.build.outputs.signed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download signed IPA
        uses: actions/download-artifact@v4
        with:
          name: lakhsly-ios-signed
          path: ipa

      - name: Generate OTA site
        shell: bash
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          set -euo pipefail
          mkdir -p _site
          cp ipa/lakhsly.ipa _site/lakhsly.ipa
          cp ota/devices.json _site/devices.json
          cp ota/profile.mobileprovision _site/profile.mobileprovision

          VERSION=$(python3 -c "
          import plistlib, zipfile
          with zipfile.ZipFile('_site/lakhsly.ipa') as z:
              pl = plistlib.loads(z.read('Payload/Runner.app/Info.plist'))
          print(pl['CFBundleShortVersionString'])
          ")
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if [ -n "${WORKER_URL:-}" ]; then
          sed "s|__WORKER__|${WORKER_URL}|g" > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Lakhsly - Install</title>
            <style>
              body { font-family: -apple-system, Segoe UI, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
              .card { background: #1e293b; padding: 32px; border-radius: 16px; text-align: center; max-width: 380px; width: 100%; }
              h1 { margin: 0 0 8px; font-size: 22px; }
              p { color: #94a3b8; font-size: 14px; line-height: 1.55; }
              .btn { display: block; background: #38bdf8; color: #082f49; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 16px; margin: 18px 0; }
              .btn:disabled { background: #334155; color: #94a3b8; }
              .badge { display: inline-block; background: #0ea5e9; color: #082f49; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600; }
              .hidden { display: none; }
              .small { font-size: 12px; color: #64748b; }
              ol { text-align: left; color: #cbd5e1; font-size: 14px; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>Lakhsly</h1>
              <p>Self-service install for registered iPhones.</p>

              <div id="step1">
                <p><b>Step 1 - Register this device</b></p>
                <p>Open this page in <b>Safari</b>, then tap the button below and install the profile.</p>
                <a class="btn" id="registerBtn" href="__WORKER__/udid">Install Device Profile</a>
                <p class="small">After installing: Settings &gt; Profile Downloaded &gt; Install.<br>This only identifies your device - it does not manage it.</p>
              </div>

              <div id="waiting" class="hidden">
                <p class="badge">Waiting for registration…</p>
                <p>If you already installed the profile, this page updates automatically.</p>
                <a class="btn" href="__WORKER__/udid">Re-install Device Profile</a>
              </div>

              <div id="building" class="hidden">
                <p class="badge">Registered - building…</p>
                <p>Your device is in the queue. A signed build takes about 10 minutes. This page refreshes automatically.</p>
              </div>

              <div id="ready" class="hidden">
                <p class="badge" id="readyBadge">Registered</p>
                <p>Your device can install Lakhsly.</p>
                <a class="btn" id="installBtn" href="itms-services://?action=download-manifest&amp;url=https%3A%2F%2Fabdelrhmanezzat1.github.io%2Flkhaslyv.2%2Fmanifest.plist">Install Lakhsly</a>
                <p class="small" id="versionText"></p>
              </div>

              <div id="full" class="hidden">
                <p class="badge">Registration full</p>
                <p>Lakhsly has reached its device limit of 15.</p>
              </div>
            </div>
            <script>
              var worker = "__WORKER__";
              var params = new URLSearchParams(window.location.search);
              var udid = params.get("udid");
              function show(id) {
                ["step1","waiting","building","ready","full"].forEach(function(x){ document.getElementById(x).classList.add("hidden"); });
                document.getElementById(id).classList.remove("hidden");
              }
              function poll() {
                if (!udid) { show("step1"); return; }
                fetch(worker + "/api/status?udid=" + encodeURIComponent(udid))
                  .then(function(r){ return r.json(); })
                  .then(function(s) {
                    if (!s.registered) {
                      if (s.count >= s.cap) { show("full"); } else { show("waiting"); }
                    } else if (s.canInstall) {
                      show("ready");
                      document.getElementById("versionText").textContent = "Version " + s.version;
                    } else {
                      show("building");
                    }
                  })
                  .catch(function(){ show("waiting"); });
              }
              poll();
              setInterval(poll, 10000);
            </script>
          </body>
          </html>
          HTML
          else
            cat > _site/index.html <<'HTML'
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Lakhsly - Install</title>
              <style>
                body { font-family: -apple-system, Segoe UI, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
                .card { background: #1e293b; padding: 32px; border-radius: 16px; text-align: center; max-width: 380px; width: 100%; }
                h1 { margin: 0 0 8px; font-size: 22px; }
                p { color: #94a3b8; font-size: 14px; line-height: 1.55; }
                .btn { display: block; background: #38bdf8; color: #082f49; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 16px; margin: 18px 0; }
                .small { font-size: 12px; color: #64748b; }
              </style>
            </head>
            <body>
              <div class="card">
                <h1>Lakhsly</h1>
                <p>Available for registered devices.</p>
                <a class="btn" href="itms-services://?action=download-manifest&amp;url=https%3A%2F%2Fabdelrhmanezzat1.github.io%2Flkhaslyv.2%2Fmanifest.plist">Install Lakhsly</a>
                <p class="small">Open in Safari. First time you'll need to trust the developer: Settings &gt; General &gt; VPN &amp; Device Management.</p>
              </div>
            </body>
            </html>
            HTML
          fi

          cat > _site/build-info.json <<EOF
          {
            "builtAt": "${BUILT_AT}",
            "version": "${VERSION}",
            "bundleId": "com.anaranar.lkhsly"
          }
          EOF

          cat > _site/manifest.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>items</key>
          	<array>
          		<dict>
          			<key>assets</key>
          			<array>
          				<dict>
          					<key>kind</key>
          					<string>software-package</string>
          					<key>url</key>
          					<string>https://abdelrhmanezzat1.github.io/lkhaslyv.2/lakhsly.ipa</string>
          				</dict>
          			</array>
          			<key>metadata</key>
          			<dict>
          				<key>bundle-identifier</key>
          				<string>com.anaranar.lkhsly</string>
          				<key>bundle-version</key>
          				<string>${VERSION}</string>
          				<key>kind</key>
          				<string>software</string>
          				<key>title</key>
          				<string>Lakhsly</string>
          			</dict>
          		</dict>
          	</array>
          </dict>
          </plist>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
