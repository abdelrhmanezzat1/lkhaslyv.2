# Codemagic CI for Lakhsly iOS - signed Ad Hoc build for OTA distribution.
#
# Requires Codemagic secrets:
#   group `signing`:
#     SIGNING_CERTIFICATE_P12          - base64 of the NEW provider .p12
#                                        (repo asset: 00008130-000A1C5A1043401C.p12;
#                                        password lives ONLY in Codemagic secrets - never in the repo)
#     SIGNING_CERTIFICATE_P12_PASSWORD - the provider's p12 password
#   group `app_secrets`:
#     SUPABASE_URL, SUPABASE_ANON_KEY, MAPBOX_ACCESS_TOKEN,
#     MAPBOX_DOWNLOADS_TOKEN, FIREBASE_* (see "Create .env from secrets")
#
# This is the RELEASE workflow: it always produces a signed Ad Hoc IPA.
# If the signing secrets are absent the workflow FAILS immediately (no unsigned
# fallback here - unsigned verification lives in .github/workflows/build-ios.yml).
# The OTA site is only ever published from a verified signed IPA.
#
# No App Store Connect publishing: the signed .ipa is only published as a
# build artifact for OTA distribution.
workflows:
  ios-release:
    name: Build Lakhsly iOS (signed Ad Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.44.4
      xcode: latest
      groups:
        - app_secrets
        - signing
        - ci
    scripts:
      - name: Setup Mapbox token
        script: |
          if [ -n "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "machine api.mapbox.com login macos password $MAPBOX_DOWNLOADS_TOKEN" > ~/.netrc
            chmod 0600 ~/.netrc
          fi

      - name: Install dependencies
        script: |
          flutter pub get
          cd ios && pod install && cd ..

      - name: Create .env from secrets
        script: |
          : > .env
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "MAPBOX_ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN"
            echo "FIREBASE_API_KEY=$FIREBASE_API_KEY"
            echo "FIREBASE_APP_ID=$FIREBASE_APP_ID"
            echo "FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            echo "FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN"
            echo "FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET"
            echo "FIREBASE_MEASUREMENT_ID=$FIREBASE_MEASUREMENT_ID"
            echo "FIREBASE_IOS_BUNDLE_ID=$FIREBASE_IOS_BUNDLE_ID"
            echo "FIREBASE_IOS_API_KEY=$FIREBASE_IOS_API_KEY"
            echo "FIREBASE_IOS_APP_ID=$FIREBASE_IOS_APP_ID"
            echo "FIREBASE_IOS_CLIENT_ID=$FIREBASE_IOS_CLIENT_ID"
          } >> .env
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$MAPBOX_ACCESS_TOKEN" ]; then
            echo "ERROR: Missing required secrets."
            exit 1
          fi

      - name: Import signing certificate
        script: |
          set -euo pipefail
          if [ -z "${SIGNING_CERTIFICATE_P12:-}" ] || [ -z "${SIGNING_CERTIFICATE_P12_PASSWORD:-}" ]; then
            echo "ERROR: signing secrets missing."
            echo "Set SIGNING_CERTIFICATE_P12 (base64 of the new .p12) and"
            echo "SIGNING_CERTIFICATE_P12_PASSWORD in the Codemagic 'signing' group."
            echo "This release workflow never falls back to an unsigned build."
            exit 1
          fi
          PROFILE_PATH="00008130-000A1C5A1043401C/00008130-000A1C5A1043401C.mobileprovision"
          test -f "$PROFILE_PATH" || {
            echo "ERROR: new provisioning profile not found at $PROFILE_PATH."
            echo "Old profiles (ota/profile.mobileprovision, _quarantine/) must never be used."
            exit 1
          }

          KEYCHAIN="$CM_BUILD_DIR/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$CM_BUILD_DIR/sign.p12"
          security import "$CM_BUILD_DIR/sign.p12" \
            -k "$KEYCHAIN" \
            -P "$SIGNING_CERTIFICATE_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          PROFILE_APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          if [ "$PROFILE_APPID" != "9FTBM39AHP.app.jujube1760.cassava8287" ]; then
            echo "ERROR: profile application-identifier '$PROFILE_APPID' does not match expected '9FTBM39AHP.app.jujube1760.cassava8287'."
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "SIGNED=true" >> $CM_ENV
          echo "Signing identity imported (profile $PROFILE_UUID, appid $PROFILE_APPID)"

      - name: Build signed IPA
        script: |
          set -euo pipefail
          if [ "${SIGNED:-false}" != "true" ]; then
            echo "ERROR: signing was not configured - cannot build a release IPA."
            exit 1
          fi

          cat > "$CM_BUILD_DIR/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>method</key>
          	<string>ad-hoc</string>
          	<key>teamID</key>
          	<string>9FTBM39AHP</string>
          	<key>uploadSymbols</key>
          	<true/>
          	<key>provisioningProfiles</key>
          	<dict>
          		<key>app.jujube1760.cassava8287</key>
          		<string>${PROFILE_UUID}</string>
          	</dict>
          </dict>
          </plist>
          EOF
          flutter build ipa --release --export-options-plist="$CM_BUILD_DIR/ExportOptions.plist"

          # Canonical artifact name for the OTA download link.
          if ls build/ios/ipa/*.ipa >/dev/null 2>&1; then
            cp "$(ls build/ios/ipa/*.ipa | head -n 1)" build/ios/ipa/lakhsly.ipa
          fi
          test -f build/ios/ipa/lakhsly.ipa || {
            echo "ERROR: flutter build ipa did not produce build/ios/ipa/lakhsly.ipa"
            exit 1
          }

      - name: Verify signed Ad Hoc IPA
        script: |
          set -euo pipefail
          IPA="$CM_BUILD_DIR/build/ios/ipa/lakhsly.ipa"
          APPDIR="$CM_BUILD_DIR/verify"
          rm -rf "$APPDIR" && mkdir -p "$APPDIR"
          unzip -q "$IPA" -d "$APPDIR"
          APP="$APPDIR/Payload/Runner.app"
          test -d "$APP" || { echo "ERROR: Payload/Runner.app missing in IPA"; exit 1; }

          # 1. Bundle ID must match.
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          if [ "$BUNDLE" != "app.jujube1760.cassava8287" ]; then
            echo "ERROR: IPA bundle id '$BUNDLE' != expected 'app.jujube1760.cassava8287'"; exit 1
          fi

          # 2. Must be signed (ad-hoc export is always signed; --no-codesign would fail here).
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 || { echo "ERROR: codesign verification failed"; exit 1; }

          # 3. Signing identity must be the Distribution cert for team 9FTBM39AHP.
          CS_INFO=$(codesign -dvvv "$APP" 2>&1)
          echo "$CS_INFO" | grep -q "Authority=iPhone Distribution: ruixian chen (9FTBM39AHP)" || {
            echo "ERROR: unexpected signing authority:"; echo "$CS_INFO" | grep Authority; exit 1;
          }
          echo "$CS_INFO" | grep -q "TeamIdentifier=9FTBM39AHP" || { echo "ERROR: TeamIdentifier mismatch"; exit 1; }

          # 4. Embedded provisioning profile must be the new Ad Hoc profile.
          test -f "$APP/embedded.mobileprovision" || { echo "ERROR: embedded.mobileprovision missing"; exit 1; }
          EP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$APP/embedded.mobileprovision")")
          EP_GTA=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:get-task-allow" /dev/stdin <<< "$(security cms -D -i "$APP/embedded.mobileprovision")")
          EP_APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /dev/stdin <<< "$(security cms -D -i "$APP/embedded.mobileprovision")")
          if [ "$EP_UUID" != "${PROFILE_UUID:-}" ]; then
            echo "ERROR: embedded profile UUID '$EP_UUID' != installed profile UUID '${PROFILE_UUID:-}'"; exit 1
          fi
          if [ "$EP_GTA" != "false" ]; then
            echo "ERROR: get-task-allow=$EP_GTA (expected false = Ad Hoc/App Store, not Development)"; exit 1
          fi
          if [ "$EP_APPID" != "9FTBM39AHP.app.jujube1760.cassava8287" ]; then
            echo "ERROR: embedded profile appid '$EP_APPID' mismatch"; exit 1
          fi

          echo "OK: signed Ad Hoc IPA verified (bundle=$BUNDLE, team=9FTBM39AHP, profile=$EP_UUID, get-task-allow=false)"

      - name: Publish OTA site
        script: |
          set -euo pipefail
          IPA="$CM_BUILD_DIR/build/ios/ipa/lakhsly.ipa"
          if [ "${SIGNED:-false}" != "true" ] || [ ! -f "$IPA" ]; then
            echo "ERROR: no verified signed IPA to publish - refusing to touch the OTA site."
            exit 1
          fi
          if [ -z "${GH_PAT:-}" ]; then
            echo "ERROR: GH_PAT missing (variable group 'ci') - cannot publish OTA site."
            echo "Add a GitHub token with 'contents: write' to the 'ci' group."
            exit 1
          fi

          # Safety guards: never overwrite the live site with a wrong/stale artifact.
          INFO=$(python3 -c "import plistlib,zipfile; print('\n'.join([plistlib.loads(zipfile.ZipFile('$IPA').read('Payload/Runner.app/Info.plist'))['CFBundleIdentifier'], plistlib.loads(zipfile.ZipFile('$IPA').read('Payload/Runner.app/Info.plist'))['CFBundleShortVersionString']]))")
          BUNDLE=$(printf '%s' "$INFO" | sed -n '1p')
          VERSION=$(printf '%s' "$INFO" | sed -n '2p')
          if [ "$BUNDLE" != "app.jujube1760.cassava8287" ]; then
            echo "ERROR: refusing to publish IPA with bundle id '$BUNDLE' (expected app.jujube1760.cassava8287)."
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "ERROR: could not read CFBundleShortVersionString from IPA - refusing to publish."
            exit 1
          fi

          # GitHub Pages source is the gh-pages BRANCH (verified 2026-10-16),
          # so this push IS the live deployment. Publish the COMPLETE rendered
          # site (IPA + manifest + build-info + install page), not just the IPA.
          REPO="abdelrhmanezzat1/lkhaslyv.2"
          AUTH=$(printf 'x-access-token:%s' "$GH_PAT" | base64 | tr -d '\n')
          rm -rf "$CM_BUILD_DIR/gh-pages"
          git -c http.extraHeader="Authorization: Basic $AUTH" \
            clone --depth 1 -b gh-pages "https://github.com/$REPO.git" "$CM_BUILD_DIR/gh-pages"
          cp "$IPA" "$CM_BUILD_DIR/gh-pages/lakhsly.ipa"
          sed "s#__VERSION__#${VERSION}#g" ota/manifest.plist > "$CM_BUILD_DIR/gh-pages/manifest.plist"
          BUILT_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          sed "s#__VERSION__#${VERSION}#g; s#__BUILT_AT__#${BUILT_AT}#g" ota/build-info.json > "$CM_BUILD_DIR/gh-pages/build-info.json"
          cp ota/index.html "$CM_BUILD_DIR/gh-pages/index.html"
          git -C "$CM_BUILD_DIR/gh-pages" config user.name ota-bot
          git -C "$CM_BUILD_DIR/gh-pages" config user.email ota-bot@users.noreply.github.com
          git -C "$CM_BUILD_DIR/gh-pages" add lakhsly.ipa manifest.plist build-info.json index.html
          if git -C "$CM_BUILD_DIR/gh-pages" diff --cached --quiet; then
            echo "gh-pages already has this exact site - nothing to publish."
          else
            git -C "$CM_BUILD_DIR/gh-pages" commit -m "ota: publish Codemagic build $CM_BUILD_ID (v${VERSION}, app.jujube1760.cassava8287)"
            git -c http.extraHeader="Authorization: Basic $AUTH" \
              -C "$CM_BUILD_DIR/gh-pages" push origin gh-pages
            echo "OTA site published to gh-pages (v${VERSION})."
          fi
          # NOTE: the previous dispatch of ota-deploy.yml was removed. That
          # workflow deploys via GitHub Pages Actions, which is NOT the live
          # source while Pages is configured as "Deploy from branch". It can be
          # re-enabled after the owner switches Pages source to GitHub Actions.

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      email:
        recipients:
          - abdelrahmansoliman101@gmail.com
